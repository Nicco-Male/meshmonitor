name: Promote validated integration to main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'ci: promote validated integration to main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build validated merge in Git index
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_MAIN="$(git rev-parse HEAD)"
          UPSTREAM="aa290089732e72f2b4fa58e40d3581decbd66e4c"
          CUSTOM="2c03ef8474b3991b58f1d7faf8d570bcdb0d87d3"

          echo "CURRENT_MAIN=$CURRENT_MAIN" >> "$GITHUB_ENV"
          echo "UPSTREAM=$UPSTREAM" >> "$GITHUB_ENV"
          echo "CUSTOM=$CUSTOM" >> "$GITHUB_ENV"

          git config user.name "Nicco-Male"
          git config user.email "11727826+Nicco-Male@users.noreply.github.com"
          git config merge.conflictStyle diff3

          git fetch origin test/upstream-main-2026-08-26 fix/directional-traceroute-segments
          git switch --detach "$UPSTREAM"

          set +e
          git merge --no-commit --no-ff "$CUSTOM"
          MERGE_RC=$?
          set -e

          if [ "$MERGE_RC" -ne 0 ] && [ "$MERGE_RC" -ne 1 ]; then
            echo "Unexpected merge exit code: $MERGE_RC"
            exit "$MERGE_RC"
          fi

          echo "Unmerged files before resolution:"
          git diff --name-only --diff-filter=U

          git checkout --ours -- src/components/Dashboard/DashboardMap.test.tsx

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          BLOCK = re.compile(
              r'(?ms)^<<<<<<<[^\n]*\n'
              r'(.*?)'
              r'^\|\|\|\|\|\|\|[^\n]*\n'
              r'(.*?)'
              r'^=======\n'
              r'(.*?)'
              r'^>>>>>>>[^\n]*\n?'
          )

          def split_resolve(path, expected, resolver):
              p = ROOT / path
              text = p.read_text()
              count = 0

              def repl(m):
                  nonlocal count
                  count += 1
                  return resolver(count, m.group(1), m.group(2), m.group(3))

              out = BLOCK.sub(repl, text)
              if count != expected:
                  raise RuntimeError(f'{path}: attesi {expected} conflitti, trovati {count}')
              for marker in ('<<<<<<<', '|||||||', '=======', '>>>>>>>'):
                  if marker in out:
                      raise RuntimeError(f'{path}: marker residuo {marker}')
              return out

          def dashboard_resolver(n, ours, base, theirs):
              if n == 1:
                  if 'activeStyleJson' not in ours or 'distanceUnit' not in theirs:
                      raise RuntimeError('DashboardMap conflitto 1 inatteso')
                  return '    activeStyleJson,\n    distanceUnit,\n'
              if n == 2:
                  if 'Build the positioned-node array' not in ours:
                      raise RuntimeError('DashboardMap conflitto 2 inatteso')
                  return ours
              raise RuntimeError('DashboardMap: conflitto inatteso')

          dashboard = split_resolve(
              'src/components/Dashboard/DashboardMap.tsx',
              2,
              dashboard_resolver,
          )

          old = 'const { nodesWithPosition, nowMs, cutoffTime } = useMemo(() => {'
          new = 'const { nodesWithPosition, nowMs, cutoffTime, mapEligibleNodeNumsKey } = useMemo(() => {'
          if dashboard.count(old) != 1:
              raise RuntimeError('DashboardMap: destructuring upstream non trovato esattamente una volta')
          dashboard = dashboard.replace(old, new, 1)

          marker = '    const nodesWithTruePos = nodes\n'
          if dashboard.count(marker) != 1:
              raise RuntimeError('DashboardMap: pipeline nodi upstream non trovato esattamente una volta')

          eligible = '''    // Node numbers that pass the map filters even when they have no GPS
              // position. Traceroute uses this set to decide whether a known,
              // unpositioned relay may receive an estimated position.
              const mapEligibleNodeNumsKey = nodes
                .filter((n) => !n.isIgnored)
                .filter((n) => !n.hideFromMap)
                .filter(passesAgeGate)
                .filter((n) => nodePassesTransportFilter(n, { showRfNodes, showUdpNodes, showMqttNodes }, ageCutoffTime))
                .map((node) => Number(node?.nodeNum))
                .filter((nodeNum) => Number.isFinite(nodeNum))
                .sort((a, b) => a - b)
                .join(',');

          '''
          # Dedent the heredoc's Python indentation only; retain TS indentation.
          eligible = '\n'.join(line[10:] if line.startswith('          ') else line for line in eligible.splitlines()) + '\n'
          dashboard = dashboard.replace(marker, eligible + marker, 1)

          old_return = '    return { nodesWithPosition: positionedNodes, nowMs: referenceNowMs, cutoffTime: ageCutoffTime };'
          new_return = '''    return {
              nodesWithPosition: positionedNodes,
              nowMs: referenceNowMs,
              cutoffTime: ageCutoffTime,
              mapEligibleNodeNumsKey,
            };'''
          new_return = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_return.splitlines())
          if dashboard.count(old_return) != 1:
              raise RuntimeError('DashboardMap: return del useMemo upstream non trovato')
          dashboard = dashboard.replace(old_return, new_return, 1)

          def telemetry_resolver(n, ours, base, theirs):
              if n == 1:
                  m = re.search(
                      r'(?ms)(\s*<button\n\s*className="telemetry-export-btn".*?</button>)',
                      ours,
                  )
                  if not m or '!readOnly' not in theirs:
                      raise RuntimeError('Telemetry conflitto 1 inatteso')
                  return m.group(1) + '\n' + theirs

              if n == 2:
                  if 'formatValue' not in ours or '!readOnly' not in theirs:
                      raise RuntimeError('Telemetry conflitto 2 inatteso')
                  return '            canEditRange={canEditSettings && !readOnly}\n            formatValue={display.formatValue}\n'

              if n == 3:
                  if 'anySource: true' not in ours or 'contextSourceId' not in theirs:
                      raise RuntimeError('Telemetry conflitto 3 inatteso')
                  return '''    const canEditSettings = hasPermission(
                'settings',
                'write',
                { anySource: true },
              );
              const { sourceId: contextSourceId } = useSource();
              const sourceId = sourceIdProp ?? contextSourceId;
          '''

              if n == 4:
                  if 'telemetryData.length === 0' not in theirs:
                      raise RuntimeError('Telemetry conflitto 4 inatteso')
                  out = theirs
                  if 'hours={effectiveHours}' not in out:
                      target = '                timeFormat={timeFormat}\n'
                      if target not in out:
                          raise RuntimeError('Telemetry: punto inserimento hours non trovato')
                      out = out.replace(
                          target,
                          target + '                hours={effectiveHours}\n',
                          1,
                      )
                  return out

              raise RuntimeError('Telemetry: conflitto inatteso')

          telemetry = split_resolve(
              'src/components/TelemetryGraphs.tsx',
              4,
              telemetry_resolver,
          )

          def traceroute_resolver(n, ours, base, theirs):
              if n == 1:
                  if 'SegmentSnrChart' not in ours:
                      raise RuntimeError('Traceroute conflitto 1 inatteso')
                  return theirs
              if n == 2:
                  if 'onUsageClick' not in theirs:
                      raise RuntimeError('Traceroute conflitto 2 inatteso')
                  return theirs
              if n == 3:
                  if '[showPaths' not in theirs:
                      raise RuntimeError('Traceroute conflitto 3 inatteso')
                  return theirs.replace('themeColors.overlay0', 'themeColors.faint')
              if n == 4:
                  if 'colorMode="custom"' not in theirs:
                      raise RuntimeError('Traceroute conflitto 4 inatteso')
                  return theirs.replace('themeColors.overlay0', 'themeColors.faint')
              if n == 5:
                  if '[showRoute' not in theirs:
                      raise RuntimeError('Traceroute conflitto 5 inatteso')
                  return theirs.replace('themeColors.overlay0', 'themeColors.faint')
              raise RuntimeError('Traceroute: conflitto inatteso')

          traceroute = split_resolve(
              'src/hooks/useTraceroutePaths.tsx',
              5,
              traceroute_resolver,
          )

          outputs = {
              'src/components/Dashboard/DashboardMap.tsx': dashboard,
              'src/components/TelemetryGraphs.tsx': telemetry,
              'src/hooks/useTraceroutePaths.tsx': traceroute,
          }

          for path, text in outputs.items():
              for conflict_marker in ('<<<<<<<', '|||||||', '=======', '>>>>>>>'):
                  if conflict_marker in text:
                      raise RuntimeError(f'{path}: marker residuo {conflict_marker}')

          for path, text in outputs.items():
              (ROOT / path).write_text(text)
              print(f'[OK] {path}')
          PY

          git add \
            src/components/Dashboard/DashboardMap.test.tsx \
            src/components/Dashboard/DashboardMap.tsx \
            src/components/TelemetryGraphs.tsx \
            src/hooks/useTraceroutePaths.tsx

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Conflitti residui:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run validated traceroute and telemetry tests
        run: |
          npx vitest run \
            src/components/Dashboard/DashboardMap.test.tsx \
            src/components/TelemetryGraphs.test.tsx \
            src/hooks/useTraceroutePaths.test.tsx \
            src/hooks/useTraceroutePaths.mapTtl.test.tsx \
            src/components/map/layers/TraceroutePathsLayer.test.tsx \
            src/components/map/layers/TraceroutePathsLayer.directional.test.tsx \
            src/components/map/layers/TraceroutePathsLayer.mapTtl.test.tsx \
            src/components/map/popups/RouteSegmentPopup.test.tsx \
            src/components/map/popups/RouteSegmentPopup.directional.test.tsx \
            src/utils/tracerouteSegments.test.ts \
            src/utils/tracerouteSegments.movement.test.ts \
            src/utils/tracerouteSegments.snapshotStrict.test.ts \
            src/utils/tracerouteDirections.test.ts

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Create clean final commit and advance main
        shell: bash
        run: |
          set -euo pipefail

          TREE="$(git write-tree)"
          FINAL="$(printf '%s\n' 'Merge custom MeshMonitor fixes onto upstream 2026-08-26' | git commit-tree "$TREE" -p "$CURRENT_MAIN" -p "$UPSTREAM" -p "$CUSTOM")"

          echo "Final commit: $FINAL"
          git push origin "$FINAL":refs/heads/main
